[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nomnom-sandbox"
version = "0.1.0"
description = "A small worldbuilding name snack: surnames, places and pointy ears."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["flask>=3", "pycountry", "anyascii"]

[project.optional-dependencies]
dev = ["pytest>=7", "build>=1"]
scrape = ["requests", "beautifulsoup4", "curl-cffi"]

[project.scripts]
nomnom = "namegen.cli:main"

[tool.setuptools.packages.find]
include = ["namegen*", "webapp*"]

[tool.setuptools.package-data]
namegen = ["catalog.json", "onomastic_zones.json", "data/*.json"]
webapp = ["templates/*.html", "static/*.js", "static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
